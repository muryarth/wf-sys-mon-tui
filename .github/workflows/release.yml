name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write      # criar a release
      id-token: write      # atestacao de origem
      attestations: write  # atestacao de origem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag invalida: $tag (use vX.Y.Z)" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "A tag $tag nao esta na main" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/WfSysMon.Tests -c Release --nologo

      - name: Publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        # Sem .exe proprio: nao assinado, ele e bloqueado pelo Smart App Control; dotnet.exe e assinado.
        run: dotnet publish WfSysMon.csproj -c Release -r win-x64 --self-contained false -p:UseAppHost=false -o publish "-p:Version=$env:VERSION" --nologo

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $zip = "wf-sys-mon-$env:VERSION-win-x64.zip"
          Copy-Item LICENSE, packaging/wf-sys-mon.cmd publish/
          Compress-Archive -Path publish/* -DestinationPath "dist/$zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File "dist/$zip.sha256" -Encoding ascii
          "zip=dist/$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist).FullName --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes
